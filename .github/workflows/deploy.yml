name: Flutter Web Otomatik Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Projeyi Klonla (Checkout)
        uses: actions/checkout@v3

      - name: Java 11 Kurulumu (Flutter gereksinimi)
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Flutter SDK Kurulumu
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Flutter Paketlerini Indir
        run: flutter pub get

      - name: Web Icin Derle (CanvasKit ve Responsive Uyumlu)
        run: flutter build web --release --web-renderer canvaskit

      - name: FTP Uzerinden Sunucuya Gonder
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./build/web/
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.github/**
