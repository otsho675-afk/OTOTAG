# .github/workflows/deploy.yml
name: App Store Connect Upload

on:
  workflow_dispatch:

jobs:
  build_and_upload:
    runs-on: macos-14
    steps:
      - name: Depoyu Indir
        uses: actions/checkout@v4

      - name: Flutter Kurulumu
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Paketleri Getir
        run: flutter pub get

      - name: API Key Hazirla
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          cp AuthKey_7AX3MTC43V.p8 ~/.appstoreconnect/private_keys/

      - name: Fastlane ile API Key Uzerinden Profili Indir
        run: |
          gem install fastlane --no-document
          fastlane run get_provisioning_profile \
            app_identifier:"com.oto.tag" \
            api_key_path:"AuthKey_7AX3MTC43V.p8" \
            key_id:"7AX3MTC43V" \
            issuer_id:"36b48b95-a241-487f-ab43-188b92bece28"

      - name: CocoaPods Kurulumu
        run: |
          cd ios
          pod install
          cd ..

      - name: Flutter iOS Release Derlemesi
        run: |
          flutter build ipa --release

      - name: IPA Dosyasini Apple'a Gonder
        run: |
          IPA_FILE=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          if [ -z "$IPA_FILE" ]; then
            IPA_FILE=$(find build/ios/archive -name "*.xcarchive" -o -name "*.ipa" | head -n 1)
          fi
          xcrun altool --upload-app \
            -f "$IPA_FILE" \
            -t ios \
            --apiKey "7AX3MTC43V" \
            --apiIssuer "36b48b95-a241-487f-ab43-188b92bece28"