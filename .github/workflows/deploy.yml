name: App Store Connect Upload

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-latest
    steps:
      - name: Depoyu Indir
        uses: actions/checkout@v4

      - name: API Key Hazirla
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          cp AuthKey_7AX3MTC43V.p8 ~/.appstoreconnect/private_keys/

      - name: Hazir IPA Dosyasini Apple'a Gonder
        run: |
          xcrun altool --upload-app \
            -f OTOTAG.ipa \
            -t ios \
            --apiKey "7AX3MTC43V" \
            --apiIssuer "36b48b95-a241-487f-ab43-188b92bece28" 