# .github/workflows/deploy.yml
name: App Store Connect Upload

on:
  workflow_dispatch:

jobs:
  build_and_upload:
    runs-on: macos-14
    steps:
      - name: Depoyu Indir
        uses: actions/checkout@v4

      - name: Flutter Kurulumu
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Paketleri Getir
        run: flutter pub get

      - name: API Key Hazirla
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          cp AuthKey_7AX3MTC43V.p8 ~/.appstoreconnect/private_keys/

      - name: Apple Profil ve Sertifikasini Cek
        env:
          API_KEY_ID: "7AX3MTC43V"
          API_ISSUER_ID: "36b48b95-a241-487f-ab43-188b92bece28"
        run: |
          gem install fastlane --no-document
          bundle exec fastlane run app_store_connect_api_key \
            key_id:"$API_KEY_ID" \
            issuer_id:"$API_ISSUER_ID" \
            key_filepath:"AuthKey_7AX3MTC43V.p8" \
            in_house:false

      - name: Flutter iOS Release Derle ve Paketle
        run: |
          cd ios
          pod install
          cd ..
          flutter build ipa --release

      - name: IPA Dosyasini TestFlight'a Gonder
        run: |
          IPA_PATH=$(find build/ios/archive -name "*.xcarchive" -o -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          fi
          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "7AX3MTC43V" \
            --apiIssuer "36b48b95-a241-487f-ab43-188b92bece28"