name: iOS IPA Build

on:
  workflow_dispatch: # İşlemi GitHub üzerinden manuel başlatmanı sağlar

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4

      - name: Flutter Kurulumu
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Bağımlılıkları Yükle
        run: |
          flutter clean
          flutter pub get

      - name: iOS Uygulamasını Derle (İmzasız)
        run: flutter build ios --release --no-codesign

      - name: IPA Dosyasına Dönüştür
        run: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -qq -r OTOTAG.ipa Payload

      - name: IPA'yı İndirilebilir Çıktı Yap
        uses: actions/upload-artifact@v4
        with:
          name: OTOTAG-iOS-IPA
          path: OTOTAG.ipa