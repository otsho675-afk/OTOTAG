name: Flutter and PHP checks
on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib/main.dart
      - run: flutter analyze
      - run: flutter test
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax verification
        run: |
          set -e
          find lib backend -type f -name '*.php' -print0 | xargs -0 -n1 php -l
